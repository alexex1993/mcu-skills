; PlatformIO Project Configuration File
;
; NodeMCU 30-pin ESP8266 devkit (ESP-12E / ESP-12F module, 4 MB flash).
; Covers NodeMCU DevKit V1.0 / Amica (CP2102) and LoLin V3 (CH340G) alike —
; same module, same pin map, different USB bridge and board size.
;
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2              ; ESP-12E, 4 MB flash, variant "nodemcu" (D0..D10)
framework = arduino

; --- flash layout -----------------------------------------------------------
; nodemcuv2 defaults to eagle.flash.4m1m.ld: 1,044,464 B of program space and
; 1 MB of filesystem. The ~1 MB program ceiling is the flash cache window, not
; the chip — a 4 MB part does NOT give a 4 MB sketch. To trade FS for nothing
; (there is no more sketch space to win) or to grow the FS:
;   board_build.ldscript = eagle.flash.4m2m.ld   ; 2 MB FS
;   board_build.ldscript = eagle.flash.4m.ld     ; no FS at all
board_build.ldscript   = eagle.flash.4m1m.ld
board_build.filesystem = littlefs  ; SPIFFS is deprecated in core 3.x — do not use it

; --- clock ------------------------------------------------------------------
; 80 MHz is the default and is what the RF calibration data assumes. 160 MHz
; roughly doubles compute and adds ~15 mA; it is safe, but set it explicitly
; rather than relying on a board default:
;   board_build.f_cpu = 160000000L

; --- serial -----------------------------------------------------------------
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
; The ROM bootloader talks at 74880 baud (26 MHz crystal), NOT 115200. To read
; the "ets Jan 8 2013,rst cause:N,boot mode:(M,N)" banner that explains a boot
; loop, run:  pio device monitor -b 74880
;
; Opening the port asserts DTR/RTS and resets the board through the two-
; transistor auto-program circuit, so you lose the first lines. To attach
; without resetting, uncomment:
;   monitor_dtr = 0
;   monitor_rts = 0

; --- upload -----------------------------------------------------------------
upload_speed = 460800              ; 921600 is unreliable on CH340 clones
; upload_port = /dev/cu.usbserial-0001   ; only if auto-detect picks the wrong port

build_flags =
    -Wall
    -D BOARD_HAS_LED_ON_GPIO16=1   ; NodeMCU carries a second LED on GPIO16/D0
