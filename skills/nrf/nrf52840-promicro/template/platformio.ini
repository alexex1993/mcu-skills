; PlatformIO Project Configuration File
;
; ProMicro nRF52840 (V1940) — nice!nano v2 compatible clone, nRF52840 QIAA,
; Cortex-M4F @ 64 MHz, 1 MB flash / 256 KB RAM, Adafruit UF2 bootloader
; with SoftDevice S140 6.1.1 pre-flashed.
;
; This board does NOT exist in PlatformIO's nordicnrf52 platform and its
; variant does NOT exist in the Adafruit nRF52 core. Both are vendored here:
;
;   boards/promicro_nrf52840.json            board definition
;   boards/variants/promicro_nrf52840/       pin map (variant.h / variant.cpp)
;
; `board = promicro_nrf52840` resolves against boards/ in this project.
; Deleting either directory breaks the build with a confusing
; "unknown board ID" or a missing variant.h.

[env:promicro_nrf52840]
platform = nordicnrf52
board = promicro_nrf52840
framework = arduino

; Upload through the factory UF2 bootloader: double-tap RESET first,
; then PlatformIO touches the port at 1200 baud and runs adafruit-nrfutil.
upload_protocol = nrfutil

monitor_speed = 115200        ; baud is ignored by USB CDC; used by Serial1

build_flags =
    -Wall

; Uncomment if the on-board LED does not blink — blinks P0.15, P0.26 and P0.30
; at once so you can see which pin your board revision actually uses.
; build_flags = -Wall -DBLINK_ALL_LED_CANDIDATES=1
