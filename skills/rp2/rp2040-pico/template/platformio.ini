; PlatformIO Project Configuration File
;
; Raspberry Pi Pico (original, RP2040) — dual Cortex-M0+ @ 133 MHz, 264 KB SRAM,
; 2 MB QSPI flash, 3.3 V logic.
;
; board_build.core selects WHICH Arduino core you get — the single most
; consequential line in this file:
;   earlephilhower  the de-facto standard arduino-pico core (Raspberry Pi's
;                   own): USB-CDC `Serial`, EEPROM, Serial2, Wire1,
;                   analogWriteFreq(), 1 kHz analogWrite default.
;   (omitted)       the Arduino Mbed core: `framework = arduino` alone gives
;                   you this one. No EEPROM.h, no Wire1/Serial2, 500 Hz PWM,
;                   and code from most Pico tutorials does not compile.
;
; https://docs.platformio.org/page/platforms/raspberrypi.html

[env:pico]
platform = raspberrypi
board = pico                 ; original Pico, 2 MB flash (board = pico_w is the
                             ; wireless sibling, different skill)
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200        ; baud is ignored by USB CDC, used by Serial1
build_flags =
    -Wall

; Upload normally needs no button press: PlatformIO touches the USB CDC port
; at 1200 baud and a running arduino-pico sketch reboots itself into BOOTSEL
; mode for picotool. If the firmware has crashed or its USB is dead, hold
; BOOTSEL while (re)plugging the USB cable, then re-run the upload.

