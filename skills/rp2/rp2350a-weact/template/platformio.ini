; PlatformIO Project Configuration File
;
; WeAct Studio RP2350A Core Board — RP2350A (dual Cortex-M33 @ 150 MHz),
; 520 KB SRAM, 4 MB or 16 MB QSPI flash, 3.3 V logic, 12 MHz crystal.
;
; ---------------------------------------------------------------------------
; PICK THE ENV THAT MATCHES YOUR BOARD. The silkscreen next to the USB
; connector says RP2350A_V10 or RP2350A_V20 on the back; from the front, V2.0
; has a pad marked VREF on the top row and only ONE user LED, V1.0 has a pin
; marked 29 in that slot, two user LEDs and a third button marked 23@KEY.
;
;   weact_rp2350a_v20        V2.0,  4 MB flash   <- default
;   weact_rp2350a_v20_16mb   V2.0, 16 MB flash
;   weact_rp2350a_v10        V1.0,  4 MB flash
;   weact_rp2350a_v10_16mb   V1.0, 16 MB flash
;
; -DBOARD_REV=<10|20> is what include/board.h switches on; it refuses to
; compile without it, so a wrong-revision build cannot happen silently.
; ---------------------------------------------------------------------------
;
; board = rpipico2 is deliberate. There is no PlatformIO board definition for
; this board, and V2.0 is pin-for-pin a Raspberry Pi Pico 2 (same RP2350A,
; same 40-pin map, same 12 MHz crystal, same QSPI flash wiring), so the Pico 2
; definition is correct rather than merely close. Do NOT use weact_rp2350b —
; that is the RP2350B core board (QFN-80, 48 GPIO, 8 ADC), a different board.
;
; board_build.core = earlephilhower selects the arduino-pico core. Plain
; `framework = arduino` builds the Arduino Mbed core instead, which does not
; support RP2350 at all.
;
; https://docs.platformio.org/page/platforms/raspberrypi.html

[platformio]
default_envs = weact_rp2350a_v20   ; CHANGE THIS if your board is V1.0 or has
                                   ; 16 MB flash, or pass -e <env> every time

[env]
platform = raspberrypi@1.20.0   ; 1.20.0 is the first registry release with
                                ; RP2350 boards; older ones have no rpipico2
board = rpipico2
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0MB   ; raise to 1MB/2MB/... BEFORE using
                                    ; LittleFS — it mounts empty otherwise
monitor_speed = 115200              ; ignored by USB CDC, used by Serial1
build_flags =
    -Wall

[env:weact_rp2350a_v20]
build_flags = ${env.build_flags} -DBOARD_REV=20

[env:weact_rp2350a_v20_16mb]
build_flags = ${env.build_flags} -DBOARD_REV=20
board_upload.maximum_size = 16777216

[env:weact_rp2350a_v10]
build_flags = ${env.build_flags} -DBOARD_REV=10

[env:weact_rp2350a_v10_16mb]
build_flags = ${env.build_flags} -DBOARD_REV=10
board_upload.maximum_size = 16777216

; Upload normally needs no button press: PlatformIO touches the USB CDC port
; at 1200 baud, a running arduino-pico sketch reboots itself into BOOTSEL and
; picotool flashes it. If the firmware has crashed or its USB is dead, hold
; BOOT while (re)plugging the cable — an RP2350 drive appears — then re-run.
