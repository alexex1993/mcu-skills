; Waveshare ESP32-C6-LCD-1.47 -- ESP32-C6FH4 (QFN32, 4 MB in-package flash)
; with a 172x320 ST7789 LCD on SPI2 and a WS2812 RGB LED on GPIO8.
;
; There is no PlatformIO board definition for this board, so it borrows the
; generic DevKitC one and corrects the flash size below.

[env:esp32-c6-lcd-1_47]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf

; The Waveshare module carries 4 MB, not the DevKitC definition's 8 MB. Without
; both of these an oversized image links happily and then fails to boot.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; The Type-C port is the SoC's built-in USB-Serial-JTAG -- there is no bridge
; chip, so esptool talks to the ROM directly over it.
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
