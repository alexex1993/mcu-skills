; Waveshare ESP32-S3-RLCD-4.2 (SKU 33298 / 33507)
; 4.2" reflective monochrome LCD, ST7305/ST7306, 300 x 400, no backlight.
;
; Module: ESP32-S3-WROOM-1-N16R8 -> 16 MB QIO flash + 8 MB OPI PSRAM.

[env:esp32-s3-rlcd-4_2]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; N16R8 memory layout. The esp32-s3-devkitc-1 definition is an N8 with no
; PSRAM; without qio_opi the 8 MB octal PSRAM is never mapped and psramFound()
; stays false with no error message anywhere.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

; The Type-C port is wired to the ESP32-S3 native USB (USB-Serial/JTAG); there
; is no UART bridge chip on this board, so Serial must be the USB CDC or
; nothing is ever printed.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

; U8g2 2.36.18 is the PlatformIO registry's newest and already ships the
; U8G2_ST7305_300X400_* constructors. Waveshare's docs ask for "2.36.19 or
; later" (the Arduino Library Manager numbering); asking for ^2.36.19 here
; fails to resolve, so do not "fix" this line upward.
lib_deps =
    olikraus/U8g2@^2.36.18
