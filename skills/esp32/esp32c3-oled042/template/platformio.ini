; ESP32-C3 0.42" OLED board (ABRobot / 01Space "ESP32-C3-0.42LCD" and clones)
; -- ESP32-C3FH4, QFN32, 4 MB in-package flash, 400 KB SRAM, with a 72x40
; SSD1306 OLED on the chip's only I2C bus (GPIO5/GPIO6).
;
; There is no PlatformIO board definition for this board. esp32-c3-devkitm-1
; is the closest generic one and is correct on everything that matters here
; (esp32c3 MCU, 4 MB flash, 160 MHz). The board's own USB-C goes straight to
; the SoC's USB Serial/JTAG controller -- there is no bridge chip.

[env:esp32c3-oled042]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf

; The in-package flash is DIO-capable; QIO would need SPIWP/SPIHD, which are
; bonded internally. Leave this alone unless you have measured otherwise.
board_build.flash_mode = dio

upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
