; Guition JC-ESP32P4-M3-DEV
; JC-ESP32P4-M3 module: ESP32-P4NRW32 (32 MB in-package PSRAM) + 16 MB NOR flash
; + an ESP32-C6 radio co-processor on SDIO.  Framework: ESP-IDF 5.5.
;
; The OFFICIAL platform (platformio/espressif32, even 7.1.x) does not know the
; ESP32-P4 at all: it is stuck on Arduino core 2.0.17 and ships no P4 board
; definition, so `platform = espressif32` cannot build for this board.  The
; pioarduino fork below drops the real ESP-IDF and arduino-esp32 into
; PlatformIO.  Pinning it is not optional here.
;
; There is no registry entry for JC-ESP32P4-M3-DEV, so this borrows Espressif's
; ESP32-P4 Function EV Board.  With framework = espidf only build.mcu (esp32p4)
; and the flash parameters are taken from it, which is why the es/_r3 split does
; not matter here: the silicon revision is set explicitly in sdkconfig.defaults.
; See the CONFIG_ESP32P4_SELECTS_REV_LESS_V3 comment in that file first.

[env:jc-esp32p4-m3-dev]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-p4-evboard
framework = espidf

board_build.flash_mode  = qio
board_upload.flash_size = 16MB

; PlatformIO builds the partition image from board_build.partitions here, NOT
; from CONFIG_PARTITION_TABLE_* in sdkconfig — the builder reads
; board.build.partitions.  The CSV name is therefore duplicated in
; sdkconfig.defaults and the two must be kept in agreement; the file itself
; comes from ESP-IDF's own components/partition_table.
board_build.partitions = partitions_singleapp_large.csv

; The board has three USB-C sockets.  This env assumes the one wired to the
; P4's native USB-Serial/JTAG (VID:PID 303A:1001, "USB JTAG/serial debug
; unit"), which carries both flashing and the console.  The CH340C socket is
; the other flashing route — see the skill's "Flashing" section.
; The port is auto-detected; uncomment if more than one board is attached.
; upload_port  = /dev/cu.usbmodem2101
; monitor_port = /dev/cu.usbmodem2101
upload_speed   = 921600
monitor_speed  = 115200
monitor_filters = direct, esp32_exception_decoder, time

; The board has NO user LED — only a red power indicator.  BLINK_GPIO is a free
; pin on the JP1 expansion header; wire an LED and a 330R resistor to ground.
; Free JP1 pins: 1 2 3 4 5 20 32 33 45 46 47.  Do NOT use 28/29/30/31/34/35/49/
; 50/51/52 (Ethernet), 14-19 or 54 (the ESP32-C6 link), or 35 (boot strap).
build_flags = -DBLINK_GPIO=20
