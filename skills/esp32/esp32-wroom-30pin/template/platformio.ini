; ESP32-WROOM-32 dev board (30-pin header) — ESP-IDF via PlatformIO.
; Verified with PlatformIO Core 6.1.19 / platform-espressif32 7.0.1 / ESP-IDF 6.0.1.

[env:esp32dev]
platform  = espressif32@7.0.1
board     = esp32dev
framework = espidf

; 4 MB is what every ESP32-WROOM-32 module carries. Both lines are needed:
; board_upload feeds esptool, the sdkconfig symbol feeds the bootloader image header.
board_upload.flash_size = 4MB
board_build.partitions  = partitions.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -DBOARD_HAS_PSRAM=0
