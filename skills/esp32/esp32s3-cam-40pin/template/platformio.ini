; ESP32-S3-WROOM-1 CAM board, 40-pin (Freenove FNK0085 and clones)
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3cam]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ---------------------------------------------------------------------------
; The board definition above is an N8 DevKitC: quad flash, NO PSRAM. Both of
; the next two lines are mandatory on this board — without them the PSRAM is
; never mapped and every camera frame buffer allocation fails.
;   qio_opi = quad SPI flash + OCTAL SPI PSRAM  (the R8 / R16V modules)
; ---------------------------------------------------------------------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.f_flash             = 80000000L
board_build.f_cpu               = 240000000L

; 8 MB is the safe default: an N8R8 board needs it and an N16R8 board tolerates
; it (you lose the upper 8 MB). Run `pio run -t upload` once, read the
; "Detected flash size" line, and raise both numbers to 16MB / 16777216 if the
; module is an N16R8.
board_upload.flash_size   = 8MB
board_upload.maximum_size = 8388608
board_build.partitions    = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600
