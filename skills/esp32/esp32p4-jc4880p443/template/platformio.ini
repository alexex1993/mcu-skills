; Guition JC4880P443C_I_W — 4.3" 480x800 MIPI-DSI touch display board
; JC-ESP32P4-M3 module: ESP32-P4NRW32 (32 MB in-package PSRAM) + 16 MB NOR flash
; + an ESP32-C6 radio co-processor on SDIO.  Framework: ESP-IDF 5.5.
;
; The OFFICIAL platform (platformio/espressif32) ships no ESP32-P4 board
; definition at all, so `platform = espressif32` fails with "Unknown board ID
; 'esp32-p4-evboard'".  The pioarduino fork below carries the real ESP-IDF.
; Pinning it is not optional.
;
; There is no registry entry for this board, so it borrows Espressif's ESP32-P4
; Function EV Board.  With framework = espidf only build.mcu and the flash
; parameters come from it; the silicon revision is set in sdkconfig.defaults.

[env:jc4880p443]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-p4-evboard
framework = espidf

; These two feed esptool only.  Under framework = espidf they do NOT reach
; sdkconfig: without CONFIG_ESPTOOLPY_FLASHMODE_QIO=y in sdkconfig.defaults the
; image still runs the flash in DIO ("flash io: dio" in the boot log).
board_build.flash_mode  = qio
board_upload.flash_size = 16MB

; PlatformIO builds the partition image from THIS line, not from
; CONFIG_PARTITION_TABLE_* in sdkconfig.  Keep the two in agreement.
board_build.partitions = partitions_singleapp_large.csv

; Two USB-C sockets.  Flash and monitor through the one silkscreened for the
; full-speed USB (USB2 on the schematic): the P4's native USB-Serial/JTAG,
; VID:PID 303A:1001, /dev/cu.usbmodem* or /dev/ttyACM*.  The other socket is
; the high-speed OTG port and enumerates nothing until firmware drives it.
; There is no USB-UART bridge on this board.
; upload_port  = /dev/cu.usbmodem2101
; monitor_port = /dev/cu.usbmodem2101
upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = direct, esp32_exception_decoder, time
