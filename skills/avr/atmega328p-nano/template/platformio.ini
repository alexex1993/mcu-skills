; PlatformIO Project Configuration File
;
; Arduino Nano (A000005) — ATmega328P @ 16 MHz, 5 V logic, Arduino core.
; 32 KB flash of which 2 KB is reserved for the bootloader (30,720 B usable),
; 2 KB SRAM, 1 KB EEPROM.
;
; https://docs.platformio.org/page/projectconf.html

[env:nano_atmega328p]
platform = atmelavr
board = nanoatmega328new             ; Optiboot: genuine boards sold since Jan 2018.
framework = arduino
monitor_speed = 115200            ; serial monitor baud, nothing to configure on-chip

; Old-bootloader boards (pre-2018 genuine, most clones): the ATmegaBOOT
; bootloader speaks 57600 baud, not 115200. Uncommenting this one line fixes
; the "not in sync" / stk500_recv upload failure that otherwise looks like a
; driver problem. (PlatformIO's `nanoatmega328` board is the same board with
; this speed and the old bootloader preset for Burn Bootloader.)
;upload_speed = 57600

build_flags =
    -Wall

; The bootloader is reached over the USB-serial chip (FTDI on genuine boards,
; CH340 on most clones); auto-reset via DTR launches it. Nothing wired to
; D0/D1 may interfere — see the skill's flashing section.
upload_protocol = arduino
