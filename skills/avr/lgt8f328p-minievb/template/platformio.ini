; PlatformIO Project Configuration File
;
; LGT8F328P-LQFP32 MiniEVB, Nano-style 30-pin board (silkscreen "LGTBF32BP").
; LGT8XM core, AVR-instruction-compatible, 32 KB flash (29,696 B usable —
; the bootloader keeps 3 KB), 2 KB SRAM, no separate EEPROM (it is emulated
; out of the same flash — see the skill's rule 9).
;
; https://docs.platformio.org/page/projectconf.html

[env:lgt8f328p]
platform = https://github.com/darkautism/pio-lgt8fx.git
board = LGT8F328P                 ; build.variant = lgt8fx8p == the LQFP32 part
framework = arduino
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Clock. The board has NO crystal on the MCU: PB6/PB7 (XTAL1/XTAL2) go to the
; header, and the 12 MHz crystal on the board belongs to the USB-serial chip.
; So the clock source is always the internal 32 MHz RC (clock_source = 1) and
; F_OSC is always 32000000L.
;
; The core computes the prescaler as F_DIV = F_OSC / F_CPU. To run at 16 MHz,
; change ONLY f_cpu:
;
;   board_build.f_cpu = 16000000L
;
; Do NOT also set board_build.f_osc = 16000000L. That makes F_DIV = 1, the
; core leaves the RC undivided, the part runs at 32 MHz while every delay(),
; micros() and baud rate is computed for 16 MHz — everything is 2x off with
; no error anywhere. f_osc only changes when a real external crystal is
; fitted (and then clock_source = 2).
; ---------------------------------------------------------------------------
board_build.f_cpu = 32000000L
board_build.f_osc = 32000000L
board_build.clock_source = 1      ; 1 = internal RC, 2 = external crystal

build_flags =
    -Wall

; ---------------------------------------------------------------------------
; Upload over the onboard USB-serial bridge (HT42B534-1 or CH9340C — check
; the SOP16 marking). DTR auto-reset opens the bootloader; nothing to press
; on a good board. Default speed for this board definition is 57600.
;
; If avrdude reports a verification mismatch on a board that otherwise runs,
; skip the read-back:  upload_flags = -V
; ---------------------------------------------------------------------------
upload_protocol = arduino
upload_speed = 57600
;upload_flags = -V
