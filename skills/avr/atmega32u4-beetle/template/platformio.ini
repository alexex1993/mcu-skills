; PlatformIO Project Configuration File
;
; CJMCU / DFRobot "Beetle" — Mini Arduino Leonardo, ATmega32U4 @ 16 MHz, 5 V,
; 21 x 28 mm. 32 KB flash of which the Caterina bootloader keeps 4 KB
; (28,672 B usable), 2,560 B SRAM, 1 KB EEPROM, native USB.
;
; https://docs.platformio.org/page/projectconf.html

[env:beetle]
platform = atmelavr
board = leonardo                  ; PlatformIO has no "beetle" board. The Beetle
                                  ; ships the Leonardo bootloader and the Leonardo
                                  ; USB VID/PID (0x2341:0x8036), so this is the
                                  ; correct entry — it fixes F_CPU=16 MHz,
                                  ; upload_protocol=avr109 and the 1200 bps touch.
framework = arduino
monitor_speed = 115200            ; ignored by the chip: Serial is USB CDC, which
                                  ; has no baud rate. Any number works.

build_flags =
    -Wall

; Do NOT pin upload_port here. The Beetle enumerates as TWO different serial
; ports: the sketch's CDC port (PID 0x8036) and the bootloader's port
; (PID 0x0036), and they have different device names. PlatformIO opens the
; sketch port at 1200 baud to trigger the reset, then waits for the bootloader
; port to appear. A hard-coded upload_port breaks that handshake.
;
; If auto-detection fails, short ICSP pin 5 (RESET) to pin 6 (GND) on the six
; dots on the back, run `pio device list`, and pass the
; bootloader port on the command line for that one upload:
;     pio run -t upload --upload-port /dev/cu.usbmodem1411
